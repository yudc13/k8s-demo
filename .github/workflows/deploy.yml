name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，避免并发升级互相覆盖
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images (linux/amd64)
        run: |
          docker build --platform=linux/amd64 -t demo-backend:${IMAGE_TAG} ./backend
          docker build --platform=linux/amd64 -t demo-frontend:${IMAGE_TAG} ./frontend

      - name: Save images and package chart
        run: |
          docker save demo-backend:${IMAGE_TAG} demo-frontend:${IMAGE_TAG} | gzip > demo-images.tgz
          tar czf chart.tgz -C . chart
          ls -lh demo-images.tgz chart.tgz

      - name: Upload artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "demo-images.tgz,chart.tgz"
          target: /tmp
          overwrite: true

      - name: Import images and helm upgrade
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "==> Import images into k3s containerd"
            gunzip -c /tmp/demo-images.tgz | sudo k3s ctr images import -
            rm -f /tmp/demo-images.tgz

            echo "==> Sync chart"
            mkdir -p ~/k8s-demo
            rm -rf ~/k8s-demo/chart
            tar xzf /tmp/chart.tgz -C ~/k8s-demo
            rm -f /tmp/chart.tgz

            echo "==> Helm upgrade"
            cd ~/k8s-demo
            helm upgrade --install demo ./chart -n demo --create-namespace \
              -f values-server.yaml \
              --set backend.image.repository=demo-backend \
              --set backend.image.tag=${{ env.IMAGE_TAG }} \
              --set frontend.image.repository=demo-frontend \
              --set frontend.image.tag=${{ env.IMAGE_TAG }} \
              --wait --timeout 5m

            echo "==> Status"
            kubectl -n demo get pods
            curl -s http://127.0.0.1/api/hello
