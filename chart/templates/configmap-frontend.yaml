apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-demo.fullname" . }}-frontend-nginx
  labels:
    {{- include "k8s-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen {{ .Values.frontend.port }};
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://{{ include "k8s-demo.fullname" . }}-backend:{{ .Values.backend.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location = /healthz {
            access_log off;
            return 200 'ok';
        }
    }
