apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-demo.fullname" . }}-backend-config
  labels:
    {{- include "k8s-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  GREETING: {{ .Values.backend.greeting | quote }}
  PORT: {{ .Values.backend.port | quote }}
